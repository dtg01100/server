# The MCP endpoint (Streamable HTTP, http://mcp.<HOMELAB_DOMAIN>/mcp) on the
# homelab Gateway. Requests without a bearer token get 401.
# The ResponseHeaderModifier filter adds Strict-Transport-Security so a
# browser or MCP client that has already reached mcp.<domain> over HTTPS
# remembers to upgrade future requests before any bearer token is sent
# (issue #389).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp
  namespace: mcp
spec:
  parentRefs:
  - name: homelab
    namespace: envoy-gateway-system
  hostnames:
  - "mcp.${HOMELAB_DOMAIN}"
  rules:
  - backendRefs:
    - name: mcp-kubernetes-mcp-server
      port: 8080
    filters:
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        add:
        - name: Strict-Transport-Security
          value: "max-age=63072000; includeSubDomains"