# The KubeStellar Console on the homelab Gateway at kubestellar.<HOMELAB_DOMAIN>;
# its sign-in endpoints take the route in 11-login-gate.yaml.
# The ResponseHeaderModifier filter adds Strict-Transport-Security so a
# browser that has already reached kubestellar.<domain> over HTTPS remembers
# to upgrade future requests before the basic-auth password or the kc_auth
# session cookie is sent (issue #389).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubestellar-console
  namespace: kubestellar-console
spec:
  parentRefs:
  - name: homelab
    namespace: envoy-gateway-system
  hostnames:
  - "kubestellar.${HOMELAB_DOMAIN}"
  rules:
  - backendRefs:
    - name: kubestellar-console
      port: 8080
    filters:
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        add:
        - name: Strict-Transport-Security
          value: "max-age=63072000; includeSubDomains"