# A cert for the three LAN add-on hostnames (and the bare domain) into
# the Secret homelab-tls in this namespace, referenced by the homelab
# Gateway's https listener. The issuer is acme when HOMELAB_ACME_EMAIL is
# set (HTTP-01 through the Gateway, so the names must resolve to its
# MetalLB address from the ACME server), else selfsigned: a node without
# ACME still has a working https listener for the LAN add-ons, just with
# an untrusted certificate.
#
# cert-manager refuses wildcard names on HTTP-01 ("Wildcard DNS names can
# only be solved via DNS01"), so the names are listed explicitly here and
# kept in sync with the HTTPRoute hostnames in
# files/homelab/addons/{10-argo-workflows,20-mcp,30-kubestellar-console}.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-tls
  namespace: envoy-gateway-system
spec:
  secretName: homelab-tls
  dnsNames:
  - "argo.${HOMELAB_DOMAIN}"
  - "mcp.${HOMELAB_DOMAIN}"
  - "kubestellar.${HOMELAB_DOMAIN}"
  - "${HOMELAB_DOMAIN}"
  issuerRef:
    name: ${HOMELAB_ACME_ISSUER}
    kind: ClusterIssuer