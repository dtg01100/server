# Booted from the USB installer (bluefin-server-installer_<ver>.raw), the
# installer UKI starts system-install.target. The medium's ESP carries the
# disk UKI and the repart.d definitions with slot A's UUIDs pinned to this
# image's usrhash; the installer UKI names the disk UKI in
# BLUEFIN_INSTALL_KERNEL (systemd.setenv=).
#
# sysinstall erases the chosen disk before it writes, so an install failure
# leaves the target disk blank and the operator needs to see what went wrong.
# The upstream unit's FailureAction=halt would shut the machine off with
# nothing on screen, and --mute-console=yes would have hidden the error
# either way. We override both: --reboot=no + SuccessAction=reboot keeps the
# install-and-reboot flow on success, and FailureAction=none leaves the unit
# failed in the journal with its output still on /dev/console so the operator
# (or the captured serial log) can read it.
[Unit]
RequiresMountsFor=/run/bluefin/installer
SuccessAction=reboot
FailureAction=none

[Service]
ExecStart=
ExecStart=systemd-sysinstall --variables=yes --reboot=no --definitions=/run/bluefin/installer/bluefin/repart.d --kernel=${BLUEFIN_INSTALL_KERNEL}
